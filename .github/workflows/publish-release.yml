name: Publish verified desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed draft tag, e.g. v1.2.0
        required: true
        type: string
      confirmation:
        description: Type PUBLISH to make both platforms available to clients
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-draft
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-24.04
    environment: release-publish
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Verify draft signatures and publish both platforms
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p 'require("./desktop/package.json").version')"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release"
          node scripts/verify_release.mjs "$RUNNER_TEMP/release"
          gh release edit "$RELEASE_TAG" --draft=false --latest
